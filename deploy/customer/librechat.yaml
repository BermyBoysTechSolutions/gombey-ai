version: 1.3.17

interface:
  appTitle: "${GOMBEY_BRAND_NAME}"
  customLogo: "/images/gombey_logo.png"
  favicon: "/assets/favicon-32x32.png"
  modelSelect: true
  customWelcome: "Welcome to your dedicated Gombey AI workspace."
  # Keep member conversations private by disabling user-created share links.
  # The staging and customer templates seed this for the default USER role.
  sharedLinks: false
  privacyPolicy:
    externalUrl: "https://gombeytech.com/privacy"
    openNewTab: true
  termsOfService:
    externalUrl: "https://gombeytech.com/terms"
    openNewTab: true
  # Preserve role-specific defaults: ADMIN can create/share; USER can use but
  # cannot share, and neither role can publish an agent to the instance.
  agents:
    use: true
    public: false
  fileSearch: true
  fileCitations: true
  marketplace:
    use: false

fileConfig:
  endpoints:
    openAI:
      disabled: false
  serverFileSizeLimit: 52428800
  avatarSizeLimit: 2097152

endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "openai/gpt-4o-mini"
          - "deepseek/deepseek-v4-flash-0731"
          - "qwen/qwen3.5-9b"
        fetch: true
      titleConvo: true
      titleModel: "openai/gpt-4o-mini"
      dropParams: ["stop"]
      modelDisplayLabel: "OpenRouter"
  agents:
    # Keep the pilot to a shared, document-grounded assistant; no autonomous actions yet.
    capabilities:
      - file_search

modelSpecs:
  prioritize: true
  addedEndpoints:
    - agents
  list:
    - name: gombey-staging-luna
      label: GPT-6 Luna
      description: Lower-cost default for routine staging tests.
      default: true
      showInMenu: true
      preset:
        endpoint: openAI
        model: gpt-6-luna
    - name: gombey-openrouter-deepseek-v4-flash
      label: DeepSeek V4 Flash (OpenRouter test)
      description: Optional low-cost model for synthetic checks; requires the user's own OpenRouter key and does not replace the shared GPT-6 Luna agent.
      group: OpenRouter
      authType: user_provided
      showInMenu: true
      preset:
        endpoint: OpenRouter
        model: deepseek/deepseek-v4-flash-0731
    - name: gombey-openrouter-qwen-3-5-9b
      label: Qwen 3.5 9B (OpenRouter test)
      description: Low-cost option for synthetic tests; requires the user's own OpenRouter key and does not replace the shared GPT-6 Luna agent.
      group: OpenRouter
      authType: user_provided
      showInMenu: true
      preset:
        endpoint: OpenRouter
        model: qwen/qwen3.5-9b
