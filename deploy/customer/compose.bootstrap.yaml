# First-admin bootstrap only. Keep registration enabled only on this local
# SSH-tunneled endpoint, then stop this stack and launch compose.yaml normally.
services:
  api:
    ports:
      - "127.0.0.1:3080:3080"
    environment:
      DOMAIN_CLIENT: http://localhost:3080
      DOMAIN_SERVER: http://localhost:3080
      ALLOW_REGISTRATION: "true"

  caddy:
    profiles: [bootstrap-disabled]
