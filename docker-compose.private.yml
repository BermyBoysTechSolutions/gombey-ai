services:
  local-gateway:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: gombey-ai-local-gateway
    command: ["node", "/app/branding/local-gateway.mjs"]
    environment:
      LISTEN_PORT: "11434"
      MIN_OUTPUT_TOKENS: "8192"
      OLLAMA_CONTEXT_TOKENS: "${OLLAMA_CONTEXT_TOKENS:-16384}"
      OLLAMA_UPSTREAM_URL: "${OLLAMA_UPSTREAM_URL:-http://host.docker.internal:11434}"
    volumes:
      - ./branding/local-gateway.mjs:/app/branding/local-gateway.mjs:ro
    networks:
      - gombey_private
      - gombey_frontdoor
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:11434/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_healthy
      local-gateway:
        condition: service_healthy
    networks:
      - gombey_private
      # A separate host-facing network is required for Docker to publish the
      # browser UI on the Mac while Ollama and MongoDB remain internal-only.
      - gombey_frontdoor

  mongodb:
    networks:
      - gombey_private

  # The model runtime lives inside the same private network as the app.
  # Pull models before starting api with scripts/private-model-bootstrap.sh.
  ollama:
    image: ollama/ollama:latest
    container_name: gombey-ai-ollama
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - gombey_private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  gombey_private:
    name: gombey-private
    internal: true
  gombey_frontdoor:
    name: gombey-frontdoor

volumes:
  ollama_models:
